[project]
name = "revive"
version = "0.1.0"
description = "Revive: connects how your body is doing with how your AI work is going."
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.40",
    "bleak>=3.0.2",
    "fastapi>=0.115",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
